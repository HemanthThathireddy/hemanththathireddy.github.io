<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />

    <title>Hemanth Thathireddy — Full-Stack Engineer</title>
    <meta
      name="description"
      content="Full-stack engineer based in Chicago. Building infrastructure-aware web tooling, internal platforms, and the boring infrastructure that makes the interesting stuff possible."
    />

    <!-- Inline-SVG monogram favicon — no extra file fetch -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Inter,sans-serif' font-size='24' font-weight='700' fill='%23f0f0f0'%3EHT%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Font preconnects so the @import in globals.css resolves on the fast path -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Hemanth Thathireddy — Full-Stack Engineer"
    />
    <meta
      property="og:description"
      content="Full-stack engineer based in Chicago. Building infrastructure-aware web tooling and internal platforms."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-bg text-text-primary">
    <div id="root"></div>
    <noscript>
      <p style="color: #f0f0f0; padding: 2rem; font-family: system-ui;">
        This site requires JavaScript. The good news is the source is
        readable on
        <a href="https://github.com/hemanth-thathireddy" style="color: #6c63ff;">
          GitHub
        </a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
